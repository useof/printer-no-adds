server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # APK-ul: tip MIME corect (altfel Chrome pe Android îl tratează ca text) și
    # fără cache, pentru că fișierul e rescris la fiecare push pe main.
    location = /a.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="printer-no-adds.apk"';
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
