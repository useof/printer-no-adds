plugins {
    id 'com.android.application'
}

android {
    namespace 'com.noads.printer'
    compileSdk 35

    defaultConfig {
        applicationId "com.noads.printer"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // debug.keystore e COMMITAT în repo, iar `debug` îl folosește explicit în loc de
    // cheia auto-generată din ~/.android. Motivul e CI: fiecare build din Docker ar
    // porni cu un keystore nou, deci fiecare APK de pe printer.d.ocl.ro ar avea altă
    // semnătură și nu s-ar putea instala peste versiunea deja instalată pe telefon.
    // Cu keystore fix, update-ul merge direct. Nu e un secret — e cheia standard de
    // debug (parolă `android`), nu se semnează niciun release cu ea.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.12.0'
}
